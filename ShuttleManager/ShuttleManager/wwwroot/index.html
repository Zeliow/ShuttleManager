<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ShuttleManager</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/ShuttleManager.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/ShuttleManager.Shared/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ShuttleManager.styles.css" />
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="_content/ShuttleManager.Shared/lib/bootstrap/dist/css/bootstrap-icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/bootstrap-icons/bootstrap-icons.css" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <script src="_framework/blazor.webview.js" autostart="false">
    </script>

    <script>
        function scrollToBottomIfNeeded(elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;

            // Увеличиваем порог с 100 до 500 или даже больше, чтобы точнее определять "внизу"
            const isNearBottom = element.scrollHeight - element.scrollTop - element.clientHeight < 300;
            console.log(`Scroll check: ${element.scrollHeight} - ${element.scrollTop} - ${element.clientHeight} = ${element.scrollHeight - element.scrollTop - element.clientHeight}, isNearBottom: ${isNearBottom}`);

            if (isNearBottom) {
                // Откладываем скролл, чтобы дождаться полного рендеринга
                setTimeout(() => {
                    const finalElement = document.getElementById(elementId);
                    if (finalElement) {
                        finalElement.scrollTop = finalElement.scrollHeight;
                    }
                }, 10);
            }
        }

        // Оставляем старую функцию для других случаев
        function scrollToBottom(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        }
    </script>
</body>
</html>
